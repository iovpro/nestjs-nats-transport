name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test
      - run: yarn test:e2e:infra:up
      - run: yarn test:e2e

  e2e-nest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nest: ['11.2.7', '12.1.2']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:e2e:infra:up
      - run: yarn test:e2e:nest ${{ matrix.nest }}
