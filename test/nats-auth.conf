# nats-transport-test-auth (see docker-compose.yml)
jetstream {}

authorization {
  users = [
    # CON-03 connects as this user with a wrong password
    { user: e2e, password: secret }
    # Pull consumers receive messages on two-token inboxes (_INBOX.<id>), so every pull of this user is rejected;
    # replies of the JetStream API come to _INBOX.<id>.<token> and stay allowed (streams and consumers can be created)
    { user: restricted, password: secret, permissions: { subscribe: { deny: "_INBOX.*" } } }
  ]
}
